<html><head><base href="https://cdn.jsdelivr.net/npm/"><title>VR Paint</title><script src="https://cdn.jsdelivr.net/npm/ammo.js@0.0.10/ammo.js"></script><link href="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.css" rel="stylesheet"/><script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.js"></script><script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.1/dist/aframe-environment-component.min.js"></script><script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script><script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script><style>#landing-screen {position: fixed;top: 0;left: 0;width: 100%;height: 100%;background-image: url('https://source.unsplash.com/random/1920x1080?vr,paint');background-size: cover;background-position: center;display: flex;justify-content: center;align-items: center;z-index: 9999;}#landing-screen h1 {font-size: 4em;color: white;text-shadow: 2px 2px 4px rgba(0,0,0,0.5);cursor: pointer;}</style><script>function initPhysics() {const scene = document.querySelector('a-scene');scene.setAttribute('physics', 'driver: ammo; debug: true; gravity: -9.8;')}document.addEventListener('DOMContentLoaded', function () {if (typeof Ammo === 'function') {Ammo().then(function(AmmoLib) {window.Ammo = AmmoLib;initPhysics();});} else {console.error('Ammo.js failed to load')}});AFRAME.registerComponent('hand-tracking', {init: function() {this.video = document.createElement('video');this.canvas = document.createElement('canvas');this.ctx = this.canvas.getContext('2d');this.handpose = null;this.hands = { left: null, right: null };navigator.mediaDevices.getUserMedia({ video: true }) .then(stream => {this.video.srcObject = stream;this.video.play();});this.loadHandposeModel();},loadHandposeModel: async function() {this.handpose = await handpose.load();this.detectHands();},detectHands: async function() {if (this.handpose && this.video.readyState === 4) {const predictions = await this.handpose.estimateHands(this.video);if (predictions.length > 0) {this.hands.right = predictions[0];if (predictions.length > 1) {this.hands.left = predictions[1];}}}requestAnimationFrame(() => this.detectHands());},getHandPosition: function(hand) {if (this.hands[hand]) {const palm = this.hands[hand].landmarks[0];return new THREE.Vector3(palm[0], palm[1], palm[2]);}return null;}});AFRAME.registerComponent('player', {schema: {username: {type: 'string', default: ''},avatar: {type: 'string', default: ''}},init: function() {this.el.innerHTML = '';const playerModel = document.createElement('a-entity');playerModel.setAttribute('gltf-model', 'https://cdn.jsdelivr.net/gh/mozilla/hubs@master/assets/avatars/Avatar1.glb');playerModel.setAttribute('scale', '0.5 0.5 0.5');this.el.appendChild(playerModel);const nameTag = document.createElement('a-text');nameTag.setAttribute('value', this.data.username);nameTag.setAttribute('align', 'center');nameTag.setAttribute('position', '0 1.5 0');nameTag.setAttribute('scale', '0.5 0.5 0.5');this.el.appendChild(nameTag);this.setupAnimations(playerModel);},setupAnimations: function(model) {model.setAttribute('animation-mixer', '');this.walkAnimation = null;this.idleAnimation = null;model.addEventListener('model-loaded', () => {const animationNames = model.getObject3D('mesh').animations.map(a => a.name);this.walkAnimation = animationNames.find(name => name.toLowerCase().includes('walk'));this.idleAnimation = animationNames.find(name => name.toLowerCase().includes('idle'));if (this.idleAnimation) {model.setAttribute('animation-mixer', `clip: ${this.idleAnimation}`);}});},updatePositions: function(headPos, headRot, leftHandPos, rightHandPos, isVR) {this.el.setAttribute('position', {x: headPos.x, y: headPos.y - 1, z: headPos.z});this.el.setAttribute('rotation', {x: 0, y: headRot.y, z: 0});const playerModel = this.el.querySelector('[gltf-model]');if (playerModel && this.walkAnimation && this.idleAnimation) {const speed = new THREE.Vector3(headPos.x, 0, headPos.z).distanceTo(new THREE.Vector3(this.lastPos.x, 0, this.lastPos.z));if (speed > 0.01) {playerModel.setAttribute('animation-mixer', `clip: ${this.walkAnimation}`);} else {playerModel.setAttribute('animation-mixer', `clip: ${this.idleAnimation}`);}}this.lastPos = headPos;if (isVR) {this.updateHandPosition('left', leftHandPos);this.updateHandPosition('right', rightHandPos);}},updateHandPosition: function(hand, position) {const handEntity = this.el.querySelector(`#${hand}Hand`);if (!handEntity) {const newHand = document.createElement('a-entity');newHand.setAttribute('id', `${hand}Hand`);newHand.setAttribute('gltf-model', 'https://cdn.jsdelivr.net/gh/mozilla/hubs@master/assets/avatars/AvatarHand.glb');newHand.setAttribute('scale', '0.5 0.5 0.5');this.el.appendChild(newHand);}const handEntity = this.el.querySelector(`#${hand}Hand`);handEntity.setAttribute('position', position);}});AFRAME.registerComponent('multiplayer-sync', {init: function() {this.room = new WebsimSocket();this.players = {};this.isVR = false;this.room.onmessage = (event) => {const data = event.data;switch (data.type) {case 'connected':this.addPlayer(data.clientId, data.username, data.avatarUrl);break;case 'disconnected':this.removePlayer(data.clientId);break;case 'playerUpdate':this.updatePlayerPositions(data.clientId, data.headPos, data.headRot, data.leftHandPos, data.rightHandPos, data.isVR);break;case 'paint':this.addRemotePaintStroke(data.points, data.color);break;}};this.room.onPeersChanged = (peers) => {Object.keys(peers).forEach(clientId => {if (!this.players[clientId]) {this.addPlayer(clientId, peers[clientId].username, peers[clientId].avatarUrl);}});this.updatePlayerList(peers)};this.el.sceneEl.addEventListener('enter-vr', () => {this.isVR = true});this.el.sceneEl.addEventListener('exit-vr', () => {this.isVR = false});this.el.sceneEl.addEventListener('loaded', () => {this.camera = document.querySelector('[camera]');this.leftHand = document.querySelector('#leftHand');this.rightHand = document.querySelector('#rightHand');this.rig = document.querySelector('#rig');this.broadcastInterval = setInterval(() => this.broadcastPositions(), 50)})},addPlayer: function(clientId, username, avatarUrl) {if (!this.players[clientId]) {const playerEntity = document.createElement('a-entity');playerEntity.setAttribute('player', { username: username, avatar: avatarUrl });playerEntity.setAttribute('id', `player-${clientId}`);this.el.sceneEl.appendChild(playerEntity);this.players[clientId] = playerEntity}},removePlayer: function(clientId) {if (this.players[clientId]) {this.el.sceneEl.removeChild(this.players[clientId]);delete this.players[clientId]}},updatePlayerPositions: function(clientId, headPos, headRot, leftHandPos, rightHandPos, isVR) {if (this.players[clientId]) {const playerComponent = this.players[clientId].components.player;if (playerComponent) {const adjustedHeadPos = {x: headPos.x,y: headPos.y + 1,z: headPos.z};playerComponent.updatePositions(adjustedHeadPos, headRot, leftHandPos, rightHandPos, isVR)}}},updatePlayerList: function(peers) {const playerList = document.getElementById('playerList');if (playerList) {playerList.innerHTML = '';Object.values(peers).forEach(peer => {const li = document.createElement('li');li.textContent = peer.username;playerList.appendChild(li)})} else {console.warn('Player list element not found');}},broadcastPositions: function() {if (!this.camera || !this.leftHand || !this.rightHand || !this.rig) return;const headPos = new THREE.Vector3();const headRot = new THREE.Euler();const leftHandPos = new THREE.Vector3();const rightHandPos = new THREE.Vector3();this.camera.object3D.getWorldPosition(headPos);this.camera.object3D.getWorldQuaternion(headRot);if (this.isVR) {this.leftHand.object3D.getWorldPosition(leftHandPos);this.rightHand.object3D.getWorldPosition(rightHandPos);} else {const handTracking = document.querySelector('[hand-tracking]').components['hand-tracking'];const leftHand = handTracking.getHandPosition('left');const rightHand = handTracking.getHandPosition('right');if (leftHand) leftHandPos.copy(leftHand);if (rightHand) rightHandPos.copy(rightHand);}const rigPos = new THREE.Vector3();this.rig.object3D.getWorldPosition(rigPos);if (this.room.readyState === WebSocket.OPEN) {this.room.send({type: 'playerUpdate',headPos: rigPos,headRot: {x: THREE.MathUtils.radToDeg(headRot.x),y: THREE.MathUtils.radToDeg(headRot.y),z: THREE.MathUtils.radToDeg(headRot.z)},leftHandPos: leftHandPos,rightHandPos: rightHandPos,isVR: this.isVR})}},addRemotePaintStroke: function(points, color) {const entity = document.createElement('a-entity');entity.setAttribute('line', {start: points[0],end: points[1],color: color});this.el.sceneEl.appendChild(entity)} });AFRAME.registerComponent('climbable', {init: function () {this.el.classList.add('climbable')}});AFRAME.registerComponent('custom-controls', {schema: {handElement: {type: 'selector'}},init: function () {this.isVR = false;this.painting = false;this.currentColor = '#FF0000';this.paintPoints = [];this.colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF'];this.colorIndex = 0;this.activeHand = 'right';this.el.sceneEl.addEventListener('enter-vr', () => {this.isVR = true});this.el.sceneEl.addEventListener('exit-vr', () => {this.isVR = false});this.el.addEventListener('triggerdown', this.onTriggerDown.bind(this));this.el.addEventListener('triggerup', this.onTriggerUp.bind(this));this.el.addEventListener('gripdown', this.onGripDown.bind(this));this.el.addEventListener('gripup', this.onGripUp.bind(this));this.handTracking = document.querySelector('[hand-tracking]').components['hand-tracking'];window.addEventListener('keydown', (event) => {if (event.key === 'h') {this.activeHand = this.activeHand === 'right' ? 'left' : 'right';} else if (event.key === 'c') {this.colorIndex = (this.colorIndex + 1) % this.colors.length;this.currentColor = this.colors[this.colorIndex];}});},tick: function () {if (this.painting) {let handPosition;if (this.isVR) {handPosition = new THREE.Vector3();this.el.object3D.getWorldPosition(handPosition);} else {handPosition = this.handTracking.getHandPosition(this.data.handElement.id === 'leftHand' ? 'left' : 'right');if (handPosition) {handPosition.x = (handPosition.x / window.innerWidth) * 2 - 1;handPosition.y = -(handPosition.y / window.innerHeight) * 2 + 1;handPosition.z = -0.5;handPosition.unproject(document.querySelector('[camera]').getObject3D('camera'));}}if (handPosition) {this.paintPoints.push(handPosition);if (this.paintPoints.length >= 2) {this.createPaintStroke();this.paintPoints = [this.paintPoints[this.paintPoints.length - 1]]}}}},onTriggerDown: function (event) {this.painting = true},onTriggerUp: function (event) {this.painting = false;this.paintPoints = []},onGripDown: function (event) {this.currentColor = '#' + Math.floor(Math.random()*16777215).toString(16)},onGripUp: function (event) {},createPaintStroke: function () {const entity = document.createElement('a-entity');entity.setAttribute('line', {start: this.paintPoints[0],end: this.paintPoints[1],color: this.currentColor});this.el.sceneEl.appendChild(entity);const multiplayerSync = this.el.sceneEl.components['multiplayer-sync'];if (multiplayerSync && multiplayerSync.room) {multiplayerSync.room.send({type: 'paint',points: [this.paintPoints[0], this.paintPoints[1]],color: this.currentColor})}}});function hideLandingScreen() {document.getElementById('landing-screen').style.display = 'none';}</script></head><body><div id="landing-screen" onclick="hideLandingScreen()"><h1>VR Paint</h1></div><a-scene environment="preset: forest; groundColor: #445566; ground: flat; lighting: none; shadow: none; dressing: none; fog: 0.7" multiplayer-sync hand-tracking><a-entity id="rig" movement-controls="constrainToNavMesh: false; fly: true"><a-entity id="camera" camera look-controls position="0 3 0"><a-entity cursor="fuse: true; fuseTimeout: 500"position="0 0 -1"geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"material="color: black; shader: flat"></a-entity></a-entity><a-entity id="leftHand" hand-controls="hand: left" oculus-touch-controls="hand: left" custom-controls="handElement: #leftHand"></a-entity><a-entity id="rightHand" hand-controls="hand: right" oculus-touch-controls="hand: right" custom-controls="handElement: #rightHand"></a-entity></a-entity><a-sky color="#ECECEC"></a-sky><a-light type="ambient" color="#888"></a-light><a-light type="directional" position="0 1 1" intensity="0.5"></a-light></a-scene><div id="ui" style="position: absolute; top: 10px; left: 10px; color: white; font-family: Arial, sans-serif; background-color: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; max-width: 300px; z-index: 9999;"><h2 style="margin-top: 0;">VR Paint</h2><p style="margin-bottom: 5px;">Connected players:</p><ul id="playerList" style="list-style-type: none; padding-left: 0; margin-top: 0;"></ul><h3>Controls:</h3><ul><li>Trigger: Paint</li><li>Grip: Change color</li><li>H: Toggle hand</li><li>C: Change color</li></ul></div><script>document.addEventListener('DOMContentLoaded', function () {const scene = document.querySelector('a-scene');scene.addEventListener('loaded', function () {const multiplayerSync = scene.components['multiplayer-sync'];if (!multiplayerSync) {console.error('multiplayer-sync component not found');}});if (AFRAME.utils.device.isMobile()) {scene.setAttribute('renderer', 'antialias: false; precision: medium');scene.setAttribute('vr-mode-ui', 'enabled: false');const environment = document.querySelector('[environment]');environment.setAttribute('environment', 'dressing: none; ground: flat; lighting: none; s
